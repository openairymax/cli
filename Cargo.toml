[package]
name = "agentrt-console"
version = "0.1.16"
edition = "2021"
description = "AgentRT Console - user-facing console front end for the AgentRT runtime"
license = "AGPL-3.0-or-later OR Apache-2.0"
repository = "https://atomgit.com/openairymax/console"
authors = ["SPHARX Ltd."]

[dependencies]
# 网关协议层：统一消费 agentrt-rs（传输、帧解码、事件分类）
agentrt-rs = { path = "../sdk-rust" }

# HTTP client for gateway communication
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Async runtime
tokio = { version = "1", features = ["rt", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error handling
anyhow = "1.0"

# Terminal output
colored = "2"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
strip = true
